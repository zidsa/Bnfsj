name: Trigger Deploy

on:
  push:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Get theme version
        id: version
        run: |
          VERSION=$(jq -er '.version | select(type == "string" and test("^[0-9]+[.][0-9]+[.][0-9]+$"))' package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.DEPLOY_REPO_PAT }}
          repository: zidsa/deploy-vitrin-themes
          event-type: source-updated
          client-payload: '{"repository": "${{ github.repository }}", "ref": "${{ github.ref_name }}", "version": "${{ steps.version.outputs.version }}"}'
